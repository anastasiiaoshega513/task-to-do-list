{% extends "base.html" %}

{% block content %}
  <h1 class="page-title mb-0">Delete tag</h1>
  <div class="narrow-form mt-3">
    <p>Are you sure you want to delete the tag: <b>{{ tag.name }}</b>?</p>
    <form action="" method="post">
      {% csrf_token %}
      <a href="{% url 'tasks:tag-list' %}" class="btn btn-primary">Cancel</a>
      <input type="submit" value="Yes, delete" class="btn btn-danger" />
    </form>
  </div>
{% endblock %}
