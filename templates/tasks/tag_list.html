{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Tags</h1>
  <a class="btn btn-primary" style="" href="{% url 'tasks:tag-create' %}">Add</a>
</div>

<table class="table">
  <thead>
    <tr>
      <th><b>Name</b></th>
      <th><b>Update</b></th>
      <th><b>Delete</b></th>
    </tr>
  </thead>
  <tbody>
    {% for tag in tag_list %}
    <tr>
      <td>{{ tag.name }}</td>
      <td>
        <a href="{% url 'tasks:tag-update' tag.id %}" class="btn btn-secondary">Update</a>
      </td>
      <td>
        <a href="{% url 'tasks:tag-delete' tag.id %}" class="btn btn-secondary">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="3" class="text-muted">No tags yet</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
