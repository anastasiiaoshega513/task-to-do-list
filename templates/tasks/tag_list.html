{% extends "base.html" %}

{% block content %}
<h1>Tags</h1>
<table class="table">
  <thead>
    <tr>
      <th><b>Name</b></th>
      <th><b>Update</b></th>
      <th><b>Delete</b></th>
    </tr>
  </thead>
  <tbody>
    {% for tag in tag_list %}
    <tr>
      <td>{{ tag.name }}</td>
      <td>
        <a href="{% url '#' tag.id %}" class="btn btn-primary">Update</a>
      </td>
      <td>
        <form action="{% url '#' tag.id %}" method="post" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="3" class="text-muted">No tags yet</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
